name: Build and Send to Telegram

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-send:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle


      - name: Accept SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > $RUNNER_TEMP/blackbox-release.jks
          echo "KEYSTORE_PATH=$RUNNER_TEMP/blackbox-release.jks" >> $GITHUB_ENV
          echo "STORE_PASSWORD=${{ secrets.STORE_PASSWORD }}" >> $GITHUB_ENV
          echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
          echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV

      - name: Build signed APKs and AARs
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug assembleRelease \
            :Bcore:assembleDebug :Bcore:assembleRelease \
            :black-reflection:assemble :compiler:assemble

      - name: Send artifacts to Telegram
        if: ${{ env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != '' }}
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%s)
          send_file() {
            local FILE="$1" CAPTION="$2"
            [ -f "$FILE" ] || return 0
            RESPONSE=$(curl -s -F document=@"$FILE" \
              -F chat_id="$TELEGRAM_CHAT_ID" \
              -F caption="$CAPTION" \
              https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendDocument)
            MSG_ID=$(echo $RESPONSE | jq -r '.result.message_id // empty')
            [ -n "$MSG_ID" ] && curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/pinChatMessage" \
              -d chat_id="$TELEGRAM_CHAT_ID" -d message_id="$MSG_ID" > /dev/null
          }
          for APK in ./app/build/outputs/apk/debug/*.apk; do
            send_file "$APK" "[DEBUG] $(basename $APK) | $COMMIT_MSG"
          done
          for APK in ./app/build/outputs/apk/release/*.apk; do
            send_file "$APK" "[RELEASE SIGNED] $(basename $APK) | $COMMIT_MSG"
          done
          for AAR in $(find ./Bcore/build/outputs/aar -name "*.aar" 2>/dev/null); do
            send_file "$AAR" "[Bcore AAR] $(basename $AAR) | $COMMIT_MSG"
          done
          for ART in \
            $(find ./black-reflection/build/libs ./black-reflection/build/outputs -name "*.jar" -o -name "*.aar" 2>/dev/null | head -1) \
            $(find ./compiler/build/libs ./compiler/build/outputs -name "*.jar" -o -name "*.aar" 2>/dev/null | head -1); do
            send_file "$ART" "[$(basename $(dirname $ART))] $(basename $ART) | $COMMIT_MSG"
          done
