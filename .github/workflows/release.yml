name: Release

on:
  # Manual: pick patch/minor/major and it auto-increments + tags
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: true
        default: 'patch'
        type: choice
        options: [patch, minor, major]
  # Automatic: push a tag like v4.5.0 and it builds + releases that exact version
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Accept SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Compute version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            # Tag push: use the pushed tag directly
            TAG="${{ github.ref_name }}"
            NAME="${TAG#v}"
          else
            # workflow_dispatch: read latest tag and bump it
            LATEST=$(git tag --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
            [ -z "$LATEST" ] && LATEST="v0.0.0"
            CURRENT="${LATEST#v}"
            MAJOR=$(echo $CURRENT | cut -d. -f1)
            MINOR=$(echo $CURRENT | cut -d. -f2)
            PATCH=$(echo $CURRENT | cut -d. -f3)
            case "${{ github.event.inputs.bump }}" in
              major) MAJOR=$((MAJOR+1)); MINOR=0; PATCH=0 ;;
              minor) MINOR=$((MINOR+1)); PATCH=0 ;;
              *)     PATCH=$((PATCH+1)) ;;
            esac
            NAME="${MAJOR}.${MINOR}.${PATCH}"
            TAG="v${NAME}"
          fi

          MAJOR=$(echo $NAME | cut -d. -f1)
          MINOR=$(echo $NAME | cut -d. -f2)
          PATCH=$(echo $NAME | cut -d. -f3)
          CODE=$(( MAJOR * 10000 + MINOR * 100 + PATCH ))

          PREV=$(git tag --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | grep -v "^${TAG}$" | head -1)

          echo "version_name=$NAME" >> $GITHUB_OUTPUT
          echo "version_code=$CODE" >> $GITHUB_OUTPUT
          echo "tag=$TAG"           >> $GITHUB_OUTPUT
          echo "prev_tag=${PREV:-}"  >> $GITHUB_OUTPUT
          echo "Next: $TAG (code $CODE)"

      - name: Create and push tag (workflow_dispatch only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ steps.version.outputs.tag }}
          git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ${{ steps.version.outputs.tag }}

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > $RUNNER_TEMP/blackbox-release.jks
          echo "KEYSTORE_PATH=$RUNNER_TEMP/blackbox-release.jks" >> $GITHUB_ENV
          echo "STORE_PASSWORD=${{ secrets.STORE_PASSWORD }}"     >> $GITHUB_ENV
          echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}"               >> $GITHUB_ENV
          echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}"         >> $GITHUB_ENV

      - name: Build signed release APKs
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease \
            -PversionName="${{ steps.version.outputs.version_name }}" \
            -PversionCode="${{ steps.version.outputs.version_code }}"

      - name: Collect APKs
        run: mkdir -p dist && cp app/build/outputs/apk/release/*.apk dist/

      - name: Generate changelog
        id: changelog
        run: |
          PREV="${{ steps.version.outputs.prev_tag }}"
          if [ -n "$PREV" ] && git rev-parse "$PREV" >/dev/null 2>&1; then
            NOTES=$(git log ${PREV}..HEAD --pretty="- %s" --no-merges | grep -v "^- Merge")
          else
            NOTES=$(git log --pretty="- %s" --no-merges | head -20)
          fi
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES"     >> $GITHUB_OUTPUT
          echo "EOF"        >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "BlackBox ${{ steps.version.outputs.version_name }}"
          body: |
            ## What's Changed
            ${{ steps.changelog.outputs.notes }}

            ---
            **Version:** `${{ steps.version.outputs.version_name }}` · code `${{ steps.version.outputs.version_code }}`
            **Min SDK:** Android 5.0 (API 21) · **Target SDK:** Android 14 (API 34)
          files: dist/*.apk
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version_name, '-') }}

      - name: Send to Telegram
        if: ${{ env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != '' }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          VER="${{ steps.version.outputs.version_name }}"
          URL="https://github.com/${{ github.repository }}/releases/tag/$TAG"
          for APK in dist/*.apk; do
            [ -f "$APK" ] || continue
            RESPONSE=$(curl -s -F document=@"$APK" \
              -F chat_id="$TELEGRAM_CHAT_ID" \
              -F caption="$(printf '[RELEASE %s SIGNED]\n%s\n\n%s' "$TAG" "$(basename $APK)" "$URL")" \
              https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendDocument)
            MSG_ID=$(echo $RESPONSE | jq -r '.result.message_id // empty')
            [ -n "$MSG_ID" ] && curl -s -X POST \
              "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/pinChatMessage" \
              -d chat_id="$TELEGRAM_CHAT_ID" -d message_id="$MSG_ID" > /dev/null
          done
